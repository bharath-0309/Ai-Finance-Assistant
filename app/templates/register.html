{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow-sm mt-5">
<div class="card-body p-4">
<h2 class="mb-3">Create account</h2>
<form method="post">
  <label class="form-label">Name</label>
  <input class="form-control mb-3" name="name" required>
  <label class="form-label">Email</label>
  <input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label>
  <input class="form-control mb-3" type="password" name="password" minlength="6" required>
  <button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('main.login') }}">Login</a></p>
</div></div></div></div>
{% endblock %}
